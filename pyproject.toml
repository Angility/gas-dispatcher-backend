[project]
name = "gas-dispatcher-backend"
package-mode = false
version = "0.1.0"
description = ""
authors = [
    {name = "Angility",email = "genzemike1993@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
